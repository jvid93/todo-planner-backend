default: &default
  adapter: postgresql
  encoding: unicode
  pool: 10
  template: template0
  host: <%= ENV["DATABASE_HOST"] %>
  username: <%= ENV["POSTGRES_USER"] %>
  password: <%= ENV["POSTGRES_PASSWORD"] %>
  database: <%= ENV["DATABASE_NAME"] %>

test:
  <<: *default
  database: <%= ENV["DATABASE_NAME"] %>_test

development:
  <<: *default

production:
  <<: *default
